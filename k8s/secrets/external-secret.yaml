# =============================================================================
# k8s/secrets/external-secret.yaml
# Lab 4 – Secret Management with External Secrets Operator (ESO)
#
# ESO syncs secrets FROM an external store (HashiCorp Vault, AWS Secrets Manager,
# GCP Secret Manager, Azure Key Vault, etc.) INTO Kubernetes Secrets.
# The app then consumes them as standard K8s Secrets – no Vault SDK needed.
#
# Install ESO:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# Configure Vault (see also vault-secret.yaml for Vault Agent approach):
#   vault kv put secret/devops-lab/sample-app SECRET_KEY="super-secure-key-from-vault"
# =============================================================================

---
# ── ClusterSecretStore: connects ESO to HashiCorp Vault ──────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app: sample-app
spec:
  provider:
    vault:
      server: "https://vault.internal.example.com:8200"
      path: "secret"           # KV v2 mount path
      version: "v2"
      auth:
        # Kubernetes auth: the ESO pod's service account is used to authenticate
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets-system

---
# ── ExternalSecret: sync the app secret from Vault into the namespace ─────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-app-external-secret
  namespace: devops-lab
  labels:
    app: sample-app
  annotations:
    description: "Syncs sample-app secrets from Vault KV path secret/devops-lab/sample-app"
spec:
  refreshInterval: "1h"    # re-sync every hour; Vault lease TTL governs max lifetime

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  # The K8s Secret that ESO will create / update
  target:
    name: sample-app-secret
    creationPolicy: Owner    # ESO owns the Secret; deleting the ES deletes the Secret
    deletionPolicy: Retain   # keep Secret if ESO is uninstalled (safety)
    template:
      type: Opaque
      metadata:
        labels:
          app: sample-app
          managed-by: external-secrets
      # Template allows data transformation (base64, JSON parsing, etc.)
      data:
        SECRET_KEY: "{{ .SECRET_KEY }}"
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        API_TOKEN: "{{ .API_TOKEN }}"

  # Map Vault keys → K8s Secret keys
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: "secret/devops-lab/sample-app"
        property: SECRET_KEY

    - secretKey: DB_PASSWORD
      remoteRef:
        key: "secret/devops-lab/sample-app"
        property: DB_PASSWORD

    - secretKey: API_TOKEN
      remoteRef:
        key: "secret/devops-lab/sample-app"
        property: API_TOKEN

---
# ── PushSecret: push a K8s Secret value BACK into Vault ─────────────────────
# (Useful for auto-generated passwords or certs that K8s creates first)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sample-app-push-secret
  namespace: devops-lab
spec:
  refreshInterval: "10m"
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: sample-app-generated-secret   # Secret created by cert-manager / job
  data:
    - match:
        secretKey: TLS_CERT
        remoteRef:
          remoteKey: "secret/devops-lab/sample-app"
          property: TLS_CERT
