# =============================================================================
# k8s/secrets/vault-secret.yaml
# Lab 4 – Secret Management with Vault Agent Injector (alternative to ESO)
#
# The Vault Agent Injector is a mutating webhook that automatically mounts
# Vault secrets as files inside application pods – no code changes required.
#
# Install Vault + injector:
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm install vault hashicorp/vault --namespace vault --create-namespace \
#        --set "injector.enabled=true" \
#        --set "server.ha.enabled=true" \
#        --set "server.ha.replicas=3"
#
# Setup:
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config \
#       kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"
#   vault policy write devops-lab - <<EOF
#   path "secret/data/devops-lab/*" { capabilities = ["read"] }
#   EOF
#   vault write auth/kubernetes/role/sample-app \
#       bound_service_account_names=sample-app-sa \
#       bound_service_account_namespaces=devops-lab \
#       policies=devops-lab \
#       ttl=1h
# =============================================================================

---
# ── ServiceAccount for Vault auth ────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-sa
  namespace: devops-lab
  labels:
    app: sample-app
  annotations:
    description: "ServiceAccount used for Vault Kubernetes auth"

---
# ── Deployment with Vault Agent Injector annotations ─────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-vault-demo
  namespace: devops-lab
  labels:
    app: sample-app
    secret-backend: vault-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
      secret-backend: vault-agent

  template:
    metadata:
      labels:
        app: sample-app
        secret-backend: vault-agent
      annotations:
        # ── Vault Agent Injector annotations ─────────────────────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "sample-app"
        vault.hashicorp.com/agent-inject-status: "update"

        # Inject the secret at /vault/secrets/app-config.env
        vault.hashicorp.com/agent-inject-secret-app-config.env: >
          secret/data/devops-lab/sample-app

        # Template the secret into shell-sourceable KEY=VALUE format
        vault.hashicorp.com/agent-inject-template-app-config.env: |
          {{- with secret "secret/data/devops-lab/sample-app" -}}
          export SECRET_KEY="{{ .Data.data.SECRET_KEY }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          export API_TOKEN="{{ .Data.data.API_TOKEN }}"
          {{- end }}

        # Rotate: re-inject when Vault lease renews
        vault.hashicorp.com/agent-inject-command-app-config.env: >
          sh -c "kill -HUP $(cat /app/gunicorn.pid) 2>/dev/null || true"

        # TLS: verify Vault server cert
        vault.hashicorp.com/ca-cert: "/vault/tls/vault-ca.crt"

        # Resources for the injected sidecar
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "64Mi"
        vault.hashicorp.com/agent-limits-cpu:   "100m"
        vault.hashicorp.com/agent-limits-mem:   "128Mi"

        # Pre-populate secrets before the app container starts
        vault.hashicorp.com/agent-pre-populate-only: "false"

    spec:
      serviceAccountName: sample-app-sa

      containers:
        - name: sample-app
          image: your-registry/sample-app:1.0.0

          # Source the injected env file at startup via a wrapper entrypoint
          command: ["/bin/sh", "-c"]
          args:
            - |
              source /vault/secrets/app-config.env
              exec gunicorn --bind 0.0.0.0:5000 --workers 2 app:app

          ports:
            - containerPort: 5000
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001

          volumeMounts:
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true

      volumes:
        - name: vault-tls
          secret:
            secretName: vault-ca-cert
