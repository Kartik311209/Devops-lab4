# =============================================================================
# kubernetes/blue-green/green-deployment.yaml
# Enterprise DevOps Deployment Toolkit (EDDT)
#
# Green Environment: Represents the new candidate version (v2.0.0).
# Deployed in staging state; evaluated before traffic switch.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-green
  namespace: default
  labels:
    app: taskflow
    environment: production
    slot: green
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskflow
      slot: green
  template:
    metadata:
      labels:
        app: taskflow
        slot: green
        version: "2.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: taskflow
          image: taskflow:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_ENV
              value: "production"
            - name: APP_COLOR
              value: "green"
            - name: DATABASE_PATH
              value: "/data/taskflow.db"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: SECRET_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: taskflow-storage
              mountPath: /data
      volumes:
        - name: taskflow-storage
          emptyDir: {}
