# =============================================================================
# kubernetes/secrets/secret-example.yaml
# Enterprise DevOps Deployment Toolkit (EDDT)
#
# SANITIZED TEMPLATE ONLY – NEVER COMMIT REAL CREDENTIALS.
#
# To create this secret securely on your local cluster from plaintext without
# saving encoded files to Git, use:
#   kubectl create secret generic taskflow-secret \
#     --from-literal=SECRET_KEY="your-random-generated-secret" \
#     --from-literal=DB_PASSWORD="your-secure-password" \
#     --dry-run=client -o yaml > taskflow-secret.local.yaml
#
# NOTE: *.local.yaml and secret*.yaml are ignored by .gitignore.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  namespace: default
  labels:
    app: taskflow
    tier: backend
type: Opaque
stringData:
  # stringData accepts unencoded plaintext in local files, automatically base64-encoded on apply
  SECRET_KEY: "PLACEHOLDER_CHANGE_ME_IN_LOCAL_ENVIRONMENT_KEY_ABC123"
  DB_PASSWORD: "PLACEHOLDER_CHANGE_ME_DATABASE_PASSWORD_XYZ789"
